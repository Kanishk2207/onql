name: Push images & publish stack

on:
  push:
    paths:
      - 'docker/**'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'extensions/**'
      - '**/*.go'
  workflow_dispatch:

env:
  DOCKERHUB_REPO_NS: autobitdevs
  STACK_ARTIFACT_REF: docker.io/autobitdevs/onql-stack:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login (Docker Hub)
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # (Optional) Make sure compose is new enough for `publish`
      - name: Install latest Docker Compose plugin
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
            -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version

      # Build + push the images defined in docker/compose.build.yml
      - name: Build & push images
        run: |
          docker compose -f compose.build.yml build --push onql schema protocol

      # Publish docker/stack.yaml as an OCI Compose artifact
      - name: Publish stack.yaml as Compose OCI
        run: |
          docker compose -f stack.yaml publish --resolve-image-digests -y "$STACK_ARTIFACT_REF"
