x-tags: &tags
  VERSION: ${VERSION:-1.3.0}
  COMMIT: ${COMMIT:-nogit}
  DATE: ${DATE:-1970-01-01T00:00:00Z}

services:
  onql:
    build:
      context: ..
      dockerfile: docker/onql.dockerfile
      args: *tags
    image: ${DOCKER_USER:-autobitdevs}/onql:${VERSION:-1.3.0}

  schema:
    build:
      context: ../extensions/schema
      dockerfile: ../../docker/ext.dockerfile
    image: ${DOCKER_USER:-autobitdevs}/onql-schema:${VERSION:-1.3.0}

  protocol:
    build:
      context: ../extensions/protocol
      dockerfile: ../../docker/ext.dockerfile
    image: ${DOCKER_USER:-autobitdevs}/onql-protocol:${VERSION:-1.3.0}
