# stack.yaml
version: "3.9"

x-onql-env: &onql_env
  # all config through env — reproducible and 12-factor
  NATS_URL: ${NATS_URL:-nats://nats:4222}
  ONQL_LOG_LEVEL: ${ONQL_LOG_LEVEL:-info}

x-resources: &resources
  ulimits:
    nofile: { soft: 200000, hard: 200000 }
  # optional hardening (Linux)
  sysctls:
    net.core.somaxconn: 65535

networks:
  appnet: { driver: bridge }

volumes:
  nats_data: {}
  onql_store: {}

services:
  nats:
    image: nats:2.10-alpine
    command: ["-js","-m","8222","-sd","/data"]
    networks: [appnet]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/varz"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - nats_data:/data
    <<: *resources

  onql:
    image: autobitdevs/onql:1.3.0   # pin! (no latest)
    environment: *onql_env
    depends_on:
      nats:
        condition: service_healthy
    ports:
      - "${ONQL_PORT:-5656}:5656"
    networks: [appnet]
    restart: unless-stopped
    volumes:
      - onql_store:/store
    labels:
      com.centurylinklabs.watchtower.enable: "${WATCHTOWER_ENABLE:-false}"
    <<: *resources

  # Extensions (optional / profile-gated)
  schema:
    image: autobitdevs/onql-schema:1.3.0
    environment: *onql_env
    depends_on:
      nats:
        condition: service_healthy
    networks: [appnet]
    restart: unless-stopped
    profiles: ["ext"]

  protocol:
    image: autobitdevs/onql-protocol:1.3.0
    environment: *onql_env
    depends_on:
      nats:
        condition: service_healthy
    networks: [appnet]
    restart: unless-stopped
    profiles: ["ext"]

volumes:
  # NATS state (implicit create is fine; defined here for clarity)
  nats_data: {}
  # ONQL data — external to prevent accidental re-creation
  onql_store:
    external: true
    # PARAMETERIZE so you can reuse the same stack for many installs
    # Create this volume once:  docker volume create onql_a_onql_store
    name: ${ONQL_VOLUME_NAME:-onql_a_onql_store}